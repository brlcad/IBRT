name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BEXT_REVISION: 7ebceffe7991211ce5592bd65838b10d18ca0e1b
  BRLCAD_REVISION: c363f3206ea04f209a7a3e1c7e4c27d5042083ad

jobs:
  linux:
    name: Linux build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            build-essential \
            clang-18 \
            flex \
            g++-multilib \
            gcc-multilib \
            gperf \
            libc6-dev-i386 \
            libgl1-mesa-dev \
            llvm-18-dev \
            ninja-build \
            xvfb

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          cache: true

      - name: Check out pinned dependencies
        run: |
          git clone --filter=blob:none https://github.com/BRL-CAD/bext.git ../bext
          git -C ../bext checkout "$BEXT_REVISION"
          git -C ../bext apply --unidiff-zero "$GITHUB_WORKSPACE/cmake/patches/bext-ospray-boost.patch"
          git clone --filter=blob:none https://github.com/BRL-CAD/brlcad.git ../brlcad
          git -C ../brlcad checkout "$BRLCAD_REVISION"

      - name: Build the OSPRay dependency tree
        run: |
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          export CMAKE_PREFIX_PATH="/usr/lib/llvm-18:${CMAKE_PREFIX_PATH:-}"
          cmake -S ../bext -B ../bext-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_ALL=ON \
            -DENABLE_BISON=OFF \
            -DENABLE_LLVM=OFF \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DUSE_APPLESEED=OFF \
            -DUSE_BRLCAD=OFF \
            -DUSE_BRLCAD_EXTRA=OFF \
            -DUSE_GDAL=OFF \
            -DUSE_OSPRAY=ON \
            -DUSE_QT=OFF \
            -DUSE_TCL=OFF
          cmake --build ../bext-build --config Release --parallel 4

      - name: Build and install minimal BRL-CAD
        run: |
          cmake -S ../brlcad -B ../brlcad-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/../brlcad-install" \
            -DBRLCAD_BUNDLED_LIBS=BUNDLED \
            -DBRLCAD_ENABLE_MINIMAL=ON \
            -DBRLCAD_ENABLE_STRICT=OFF \
            -DBRLCAD_ENABLE_COMPILER_WARNINGS=OFF
          cmake --build ../brlcad-build --config Release --target install --parallel 4

      - name: Configure IBRT
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBEXT_INSTALL_DIR="$GITHUB_WORKSPACE/../bext-build/install" \
            -DBRLCAD_PREFIX="$GITHUB_WORKSPACE/../brlcad-install"

      - name: Build IBRT
        run: cmake --build build/ci --config Release --parallel 4

      - name: Run tests
        run: xvfb-run -a ctest --test-dir build/ci --output-on-failure -C Release
